name: Auto Release

on:
  push:
    tags:
      - 'v*'   # triggers on tags like v1.0.1, v2.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract version (remove 'v')
        id: version
        run: echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}+1/" pubspec.yaml
          cat pubspec.yaml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'   # use your Flutter version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.TAG_NAME }}
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          body: "Auto-generated release for ${{ steps.tag.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk

      - name: Checkout releases branch
        run: |
          git fetch origin releases
          git checkout releases || git checkout --orphan releases
          git reset --hard origin/releases 2>/dev/null || git rm -rf .

      - name: Update version.json
        run: |
          cat > version.json <<EOF
          {
            "latest_version": "${{ steps.version.outputs.VERSION }}",
            "min_required_version": "${{ steps.version.outputs.VERSION }}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG_NAME }}/app-release.apk",
            "release": {
              "title": "Version ${{ steps.version.outputs.VERSION }}",
              "subtitle": "What's new:",
              "new_features": [],
              "improvements": [],
              "bug_fixes": []
            }
          }
          EOF

      - name: Commit and push version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "release: ${{ steps.tag.outputs.TAG_NAME }}" || echo "No changes"
          git push https://x-access-token:${{ secrets.RELEASES_PAT }}@github.com/${{ github.repository }} releases