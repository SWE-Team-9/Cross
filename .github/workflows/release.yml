name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract version (remove 'v')
        id: version
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}+1/" pubspec.yaml
          echo "pubspec version is now:"
          grep "^version:" pubspec.yaml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.TAG_NAME }}
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          body: "Auto-generated release for ${{ steps.tag.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk

      - name: Fetch release notes
        id: fetch_release_notes
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}"
          echo "Fetching release metadata from $API"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API" -o /tmp/release.json || true
          python3 - <<'PY'
import json,sys
from pathlib import Path
try:
    data = json.load(open('/tmp/release.json'))
    body = str(data.get('body') or '')
except Exception:
    body = ''
Path('/tmp/release_body.txt').write_text(body, encoding='utf-8')
PY

      - name: Preserve source version.json
        run: |
          if [ -f version.json ]; then
            cp version.json /tmp/source-version.json
          fi

      - name: Checkout releases branch
        run: |
          git fetch origin releases
          git checkout releases || git checkout --orphan releases
          git reset --hard origin/releases 2>/dev/null || git rm -rf .

      - name: Update version.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = "${{ steps.version.outputs.VERSION }}"
          tag = "${{ steps.tag.outputs.TAG_NAME }}"
          repo = "${{ github.repository }}"

          source_path = Path('/tmp/source-version.json')
          out_path = Path('version.json')

          if source_path.exists():
            data = json.loads(source_path.read_text(encoding='utf-8'))
          else:
            data = {
              'release': {
                'subtitle': "What's new:",
                'new_features': [],
                'improvements': [],
                'bug_fixes': [],
              }
            }

          if not isinstance(data, dict):
            data = {}

          release = data.get('release')
          if not isinstance(release, dict):
            release = {}

          # Try to read release body fetched earlier from the GitHub Release
          release_body_path = Path('/tmp/release_body.txt')
          release_body = ''
          if release_body_path.exists():
            release_body = release_body_path.read_text(encoding='utf-8').strip()

          # Simple parser: split the release body into sections by headings
          parsed_sections = {'new_features': [], 'improvements': [], 'bug_fixes': []}
          if release_body:
            current = None
            for line in release_body.splitlines():
              l = line.strip()
              if not l:
                continue
              if l.startswith('#'):
                h = l.lstrip('#').strip().lower()
                if 'feature' in h:
                  current = 'new_features'
                elif 'improv' in h or 'enhanc' in h:
                  current = 'improvements'
                elif 'bug' in h or 'fix' in h or 'patch' in h:
                  current = 'bug_fixes'
                else:
                  current = None
                continue
              # list items
              if current and (l.startswith('-') or l.startswith('*') or l[0].isdigit()):
                item = l.lstrip('-*0123456789. ').strip()
                if item:
                  parsed_sections[current].append(item)
            # If no headings found but body contains bullet-like lines, treat as new_features
            if not any(parsed_sections.values()):
              bullets = [ln.strip().lstrip('-*').strip() for ln in release_body.splitlines() if ln.strip().startswith(('-', '*'))]
              if bullets:
                parsed_sections['new_features'] = [b for b in bullets if b]

          data['latest_version'] = version
          data['download_url'] = f'https://github.com/{repo}/releases/download/{tag}/app-release.apk'
          data['min_required_version'] = str(data.get('min_required_version') or version)

          release['title'] = f'Version {version}'
          release['subtitle'] = str(release.get('subtitle') or "What's new:")

          # Prefer parsed sections from the release body when present
          release['new_features'] = parsed_sections['new_features'] or list(release.get('new_features') or [])
          release['improvements'] = parsed_sections['improvements'] or list(release.get('improvements') or [])
          release['bug_fixes'] = parsed_sections['bug_fixes'] or list(release.get('bug_fixes') or [])

          data['release'] = release
          out_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit and push version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "release: ${{ steps.tag.outputs.TAG_NAME }}" || echo "No changes"
          git push https://x-access-token:${{ secrets.RELEASES_PAT }}@github.com/${{ github.repository }} releases