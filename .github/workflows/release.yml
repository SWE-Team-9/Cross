name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ── Job 1: Build Android APK ──────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Update pubspec version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}+1/" pubspec.yaml

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ── Job 2: Build Windows EXE ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${env:GITHUB_REF -replace 'refs/tags/',''}" >> $env:GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: |
          $tag = "${{ steps.tag.outputs.TAG_NAME }}"
          $version = $tag -replace '^v',''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Update pubspec version
        run: |
          (Get-Content pubspec.yaml) -replace '^version:.*', "version: ${{ steps.version.outputs.VERSION }}+1" | Set-Content pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.VERSION }} `
            windows/installer/setup.iss

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/installer/installer-output/Cross-windows-setup.exe

  # ── Job 3: Create GitHub Release ─────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]   # waits for both builds
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.TAG_NAME }}
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          body: "Release ${{ steps.tag.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          files: |
            artifacts/android/app-release.apk
            artifacts/windows/Cross-windows-setup.exe

      - name: Update version.json on releases branch
        run: |
          git fetch origin releases
          git checkout releases
          cat > version.json <<EOF
          {
            "latest_version": "${{ steps.version.outputs.VERSION }}",
            "min_required_version": "${{ steps.version.outputs.VERSION }}",
            "platforms": {
              "android": {
                "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG_NAME }}/app-release.apk",
                "update_type": "in_app"
              },
              "windows": {
                "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG_NAME }}/Cross-windows-setup.exe",
                "update_type": "browser"
              }
            },
            "release": {
              "title": "Version ${{ steps.version.outputs.VERSION }}",
              "subtitle": "What's new:",
              "new_features": [],
              "improvements": [],
              "bug_fixes": []
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "release: ${{ steps.tag.outputs.TAG_NAME }}" || echo "No changes"
          git push https://x-access-token:${{ secrets.RELEASES_PAT }}@github.com/${{ github.repository }} releases