<!DOCTYPE html>
<html>
<head>
  <title>reCAPTCHA Verification</title>

  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LcXF8osAAAAAC3Nc0YDEVF7pdxDRZAUJLUSrwwL"></script>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 200px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      cursor: pointer;
    }

    textarea {
      width: 600px;
      max-width: 90vw;
      height: 150px;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <h3>reCAPTCHA Button Test</h3>

  <form id="demo-form" onsubmit="return false;">
    <button
      class="g-recaptcha"
      data-sitekey="6LcXF8osAAAAAC3Nc0YDEVF7pdxDRZAUJLUSrwwL"
      data-callback="onSubmit"
      data-action="LOGIN"
    >
      Verify
    </button>
  </form>

  <div id="status"></div>

  <script>
    function onSubmit(token) {
      console.log("TOKEN:", token);

      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(token);
      }

      document.getElementById("status").innerHTML =
        "Verification Success<br><textarea readonly>" + token + "</textarea>";
    }
  </script>
</body>
</html>
