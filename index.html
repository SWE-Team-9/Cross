<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reCAPTCHA Verification</title>
    
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6Le9r5YsAAAAAK6BbL381ibXXvcmSuPU08ounUh1"></script>

    <style>
        body {
            background-color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: sans-serif;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #ff5500; 
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>

    <script>
        function executeRecaptcha() {
            grecaptcha.enterprise.ready(function() {
                grecaptcha.enterprise.execute('6Le9r5YsAAAAAK6BbL381ibXXvcmSuPU08ounUh1', { action: 'login' })
                    .then(function(token) {
                        if (window.chrome && window.chrome.webview) {
                            window.chrome.webview.postMessage(token);
                        } else {
                            console.log("Token generated successfully:", token);
                        }
                    })
                    .catch(function(error) {
                        console.error("reCAPTCHA Error:", error);
                    });
            });
        }
        window.onload = executeRecaptcha;
    </script>
</body>
</html>
