name: soundcloud_clone
description: Iqa3
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  app_links: ^6.4.0
  audio_service: ^0.18.12
  audio_session: ^0.1.16
  cached_network_image: ^3.3.0
  connectivity_plus: ^7.0.0
  cookie_jar: ^4.0.8
  crypto: ^3.0.3
  dartz: ^0.10.1
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  equatable: ^2.0.5
  file_picker: ^10.3.10
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^17.2.2
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  image_cropper: ^11.0.0
  image_picker: ^1.2.1
  injectable: ^2.3.0
  json_annotation: ^4.8.1
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.0
  package_info_plus: ^8.3.1
  path_provider: ^2.1.1
  permission_handler: ^11.3.1
  recaptcha_enterprise_flutter: ^18.8.2
  share_plus: ^12.0.2
  shared_preferences: ^2.2.2
  socket_io_client: ^3.1.0
  url_launcher: ^6.3.2
  vector_math: ^2.2.0
  video_player: ^2.10.0
  webview_windows: ^0.4.0

dev_dependencies:
  bloc_test: ^10.0.0

  # Code generation
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

  # Lints / tooling
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  http_mock_adapter: ^0.6.0
  injectable_generator: ^2.4.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.7.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/app_pic.jpeg
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon/app_logo1.jpeg
  web:
    generate: true
    image_path: assets/app_icon/app_logo1.jpeg
  windows:
    generate: true
    image_path: assets/app_icon/app_logo1.jpeg
    icon_size: 48
  macos:
    generate: true
    image_path: assets/app_icon/app_logo1.jpeg
flutter_native_splash:
  color: "#000000"
  image: assets/app_icon/app_pic.jpeg
  android: true
  ios: true
